name: Jenkins Migration
env:
  DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
  SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
  SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
  BRANCH_NAME: ${{ github.ref_name }}
  GIT_BRANCH: ${{ github.ref_name }}
  GIT_COMMIT: ${{ github.sha }}
  BUILD_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id
    }}
  JOB_NAME: ${{ github.workflow }}
  BUILD_NUMBER: ${{ github.run_number }}
  APPLICATION_NAME: total-back-office
  J2G_RUN_ID: junyharang-personal-project__junyss-total-back-office__a45c6da6-eval3-r0-build_feedback-i2-build16
  J2G_FAULTS: ''
jobs:
  jenkins-pipeline:
    runs-on: ubuntu-latest
    steps:
    - name: j2g-probe-install
      env:
        J2G_OP_B64: 
      run: mkdir -p /tmp/j2g && printf "%s" "$J2G_OP_B64" | base64 -d > /tmp/j2g/j2g_op
        && chmod +x /tmp/j2g/j2g_op && echo /tmp/j2g >> "$GITHUB_PATH"
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: SET_VARIABLE
      id: set_variable
      run: "set -euo pipefail\nDRIVE_ENV=\"dev\"\nif [ \"${BRANCH_NAME}\" = \"master\"\
        \ ]; then\n  DRIVE_ENV=\"prod\"\nfi\nAPPLICATON_CREDENTIAL_NAME=\"${DRIVE_ENV}${APPLICATION_NAME}-was\"\
        \nGITEA_CREDENTIAL_ID='[\uAE30\uAE54\uB098\uB294 \uC0AC\uB78C\uB4E4]gitea-backend'\n\
        GITEA_REPOSITORY_URL='http://192.168.20.3:81/giggals-s-people/TotalBackOffice-BackEnd.git'\n\
        GIT_COMMIT_AUTHOR=\"$(git --no-pager show -s --format=%an \"${GIT_COMMIT}\"\
        )\"\nGIT_COMMIT_MESSAGE=\"$(git show -s --format=%B \"${GIT_COMMIT}\")\"\n\
        PR_ID='PR\uC774 \uC874\uC7AC\uD558\uC9C0 \uC54A\uC544\uC694.'\nPR_BRANCH='PR\uC774\
        \ \uC874\uC7AC\uD558\uC9C0 \uC54A\uC544\uC694.'\nif [[ \"$GIT_COMMIT_MESSAGE\"\
        \ == *\"Merge\"* ]]; then\n  if [[ \"$GIT_COMMIT_MESSAGE\" =~ \\#([^\\)]+)\
        \ ]]; then\n    PR_ID=\"${BASH_REMATCH[1]}\"\n    PR_ID=\"$(printf '%s' \"\
        $PR_ID\" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')\"\n  fi\n  if\
        \ [[ \"$GIT_COMMIT_MESSAGE\" == *\"from\"*\"into\"* ]]; then\n    PR_BRANCH=\"\
        ${GIT_COMMIT_MESSAGE#*from}\"\n    PR_BRANCH=\"${PR_BRANCH%%into*}\"\n   \
        \ PR_BRANCH=\"$(printf '%s' \"$PR_BRANCH\" | sed -e 's/^[[:space:]]*//' -e\
        \ 's/[[:space:]]*$//')\"\n  fi\nfi\nDELIM=\"EOF_${RANDOM}_${RANDOM}\"\n{\n\
        \  echo \"DRIVE_ENV=${DRIVE_ENV}\"\n  echo \"APPLICATON_CREDENTIAL_NAME=${APPLICATON_CREDENTIAL_NAME}\"\
        \n  echo \"GITEA_CREDENTIAL_ID=${GITEA_CREDENTIAL_ID}\"\n  echo \"GITEA_REPOSITORY_URL=${GITEA_REPOSITORY_URL}\"\
        \n  echo \"GIT_COMMIT_AUTHOR=${GIT_COMMIT_AUTHOR}\"\n  printf '%s\\n' \"GIT_COMMIT_MESSAGE<<${DELIM}\"\
        \n  printf '%s\\n' \"${GIT_COMMIT_MESSAGE}\"\n  printf '%s\\n' \"${DELIM}\"\
        \n  echo \"PR_ID=${PR_ID}\"\n  echo \"PR_BRANCH=${PR_BRANCH}\"\n  echo \"\
        SONARQUBE_SERVER_NAME=SonarQube_BackEnd\"\n  echo \"SONARQUBE_CREDENTIAL_ID=backend-total-back-office\"\
        \n  echo \"JUNIT_REPORT_PATH=build/test-results/test\"\n  echo \"JACOCO_REPORT_PATH=build/jacoco/jacoco.xml\"\
        \n  echo \"CHECKSTYLE_REPORT_PATH=build/reports/checkstyle-output/checkstyle-report.xml\"\
        \n  echo \"DISCORD_SEND_MESSAGE_TITLE=\uAE30\uAE54\uB098\uB294 \uC0AC\uB78C\
        \uB4E4 \uD1B5\uD569 \uAD00\uB9AC \uC11C\uBE44\uC2A4 \uBB34\uC911\uB2E8 \uBC30\
        \uD3EC\"\n  echo \"DOCKER_SERVER_BASE_DIRECTORY=/data/deploy/giggal-total-back-office\"\
        \n} >> \"$GITHUB_ENV\"\n"
    - name: Discord start alarm
      if: ${{ success() && steps.set_variable.outcome == 'success' && env.DISCORD_WEBHOOK_URL
        != '' }}
      run: "set -euo pipefail\nprintf -v DESC '%s \uD658\uACBD \uBC30\uD3EC \uC791\
        \uC5C5 \uC2DC\uC791 \uD569\uB2C8\uB2E4.' \"$DRIVE_ENV\"\nprintf -v FOOTER\
        \ '==============\uBC30\uD3EC \uC791\uC5C5 \uC2DC\uC791============\\n\\n\uD1B5\
        \uD569 \uAD00\uB9AC WAS \uBC30\uD3EC \uC791\uC5C5\uC774 \uC2DC\uC791\uB418\
        \uC5C8\uC5B4\uC694.\\n%s(%s)\\n\\nGit Pull Request ID \uC815\uBCF4 \\n%s\\\
        n\\nGit Pull Request BRANCH \uC815\uBCF4 \\n%s\\n\\nGit COMMIT \uC720\uBC1C\
        \uC790 \uC815\uBCF4 \\n%s\\n\\nGit COMMIT Message \\n%s\\n\\nBuild URL \uC815\
        \uBCF4 \\n\\n' \"$JOB_NAME\" \"$BUILD_NUMBER\" \"$PR_ID\" \"$PR_BRANCH\" \"\
        $GIT_COMMIT_AUTHOR\" \"$GIT_COMMIT_MESSAGE\"\npayload=$(jq -n --arg title\
        \ \"$DISCORD_SEND_MESSAGE_TITLE\" --arg desc \"$DESC\" --arg footer \"$FOOTER\"\
        \ --arg url \"$BUILD_URL\" '{embeds:[{title:$title, description:$desc, footer:{text:$footer},\
        \ url:$url}]}')\ncurl -sS -H \"Content-Type: application/json\" -d \"$payload\"\
        \ \"$DISCORD_WEBHOOK_URL\"\n"
    - name: GITEA CHECKOUT
      id: gitea_checkout
      run: j2g_op gitea_checkout
    - name: GITEA CHECKOUT post success
      if: ${{ success() && steps.gitea_checkout.outcome == 'success' }}
      run: j2g_op gitea_checkout_post_success
    - name: GITEA CHECKOUT post failure
      if: ${{ failure() && steps.gitea_checkout.outcome == 'failure' }}
      run: j2g_op gitea_checkout_post_failure
    - name: "Project Build \uADF8\uB9AC\uACE0 Test \uC791\uC5C5"
      id: project_build_test
      run: j2g_op project_build_test
    - name: "Project Build \uADF8\uB9AC\uACE0 Test \uC791\uC5C5 post success"
      if: ${{ success() && steps.project_build_test.outcome == 'success' }}
      run: j2g_op project_build_test_post_success
    - name: "Project Build \uADF8\uB9AC\uACE0 Test \uC791\uC5C5 post failure"
      if: ${{ failure() && steps.project_build_test.outcome == 'failure' }}
      run: j2g_op project_build_test_post_failure
    - name: SonarQube Analysis
      id: sonar_analysis
      if: ${{ success() && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/master')
        && env.SONAR_TOKEN != '' && env.SONAR_HOST_URL != '' }}
      uses: sonarsource/sonarqube-scan-action@v2
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
      with:
        args: -Dsonar.projectKey=BE-total-back-office -Dsonar.projectName=BE-total-back-office
          -Dsonar.branch.name=master -Dsonar.language=java -Dsonar.java.source=1.8
          -Dsonar.sources=src/main/java -Dsonar.test=src/test/java -Dsonar.test.inclusion=**/*Test.java
          -Dsonar.issuesReport.console.enable=true -Dsonar.junit.reportPaths=build/test-results/test
          -Dsonar.java.binaries=build/classes -Dsonar.java.coveragePlugin=jacoco -Dsonar.coverage.jacoco.xmlReportPaths=build/jacoco/jacoco.xml
          -Dsonar.java.libraries.empty=true -Dsonar.sourceEncoding=UTF-8 -Dsonar.java.checkstyle.reportPaths=build/reports/checkstyle-output/checkstyle-report.xml
          -Dsonar.exclusions=**/dto/**,**/exception/**,**/constant/**,**/SpringInitProjectApplication.java,**/WebRestController.java,**/FileUploadYaml.java
    - name: SonarQube Analysis success alarm
      if: ${{ success() && steps.sonar_analysis.outcome == 'success' && env.DISCORD_WEBHOOK_URL
        != '' }}
      env:
        STAGE: "\uC18C\uB098\uD050\uBE0C Analysis \uD655\uC778"
      run: "set -euo pipefail\nprintf -v DESC '%s \uC791\uC5C5 \uC131\uACF5\uD588\uC5B4\
        \uC694. \U0001F600 ' \"$STAGE\"\nprintf -v FOOTER '\u24D2 2023. \uAE30\uAE54\
        \uB098\uB294 \uC0AC\uB78C\uB4E4(giggals.pepole@gmail.com) All Rights Reserved.\
        \ Blog : https://giggal-people.tistory.com/\\n'\npayload=$(jq -n --arg title\
        \ \"$STAGE\" --arg desc \"$DESC\" --arg footer \"$FOOTER\" --arg url \"$BUILD_URL\"\
        \ '{embeds:[{title:$title, description:$desc, footer:{text:$footer}, url:$url}]}')\n\
        curl -sS -H \"Content-Type: application/json\" -d \"$payload\" \"$DISCORD_WEBHOOK_URL\"\
        \n"
    - name: SonarQube Analysis failure alarm
      if: ${{ failure() && steps.sonar_analysis.outcome == 'failure' && env.DISCORD_WEBHOOK_URL
        != '' }}
      env:
        STAGE: "\uC18C\uB098\uD050\uBE0C Analysis \uD655\uC778"
      run: "set -euo pipefail\nprintf -v DESC '%s \uC791\uC5C5 \uC2E4\uD328 \uD588\
        \uC5B4\uC694 \U0001F624' \"$STAGE\"\nprintf -v FOOTER '\u24D2 2023. \uAE30\
        \uAE54\uB098\uB294 \uC0AC\uB78C\uB4E4(giggals.pepole@gmail.com) All Rights\
        \ Reserved. Blog : https://giggal-people.tistory.com/\\n'\npayload=$(jq -n\
        \ --arg title \"$STAGE\" --arg desc \"$DESC\" --arg footer \"$FOOTER\" --arg\
        \ url \"$BUILD_URL\" '{embeds:[{title:$title, description:$desc, footer:{text:$footer},\
        \ url:$url}]}')\ncurl -sS -H \"Content-Type: application/json\" -d \"$payload\"\
        \ \"$DISCORD_WEBHOOK_URL\"\n"
    - name: SonarQube Quality Gate
      id: quality_gate
      if: ${{ success() && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/master')
        && env.SONAR_TOKEN != '' && env.SONAR_HOST_URL != '' }}
      timeout-minutes: 5
      uses: sonarsource/sonarqube-quality-gate-action@v1
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
      with:
        scanMetadataReportFile: .scannerwork/report-task.txt
    - name: SonarQube Quality Gate success alarm
      if: ${{ success() && steps.quality_gate.outcome == 'success' && env.DISCORD_WEBHOOK_URL
        != '' }}
      env:
        STAGE: "\uC18C\uB098\uD050\uBE0C Quality Gate \uD655\uC778"
      run: "set -euo pipefail\nprintf -v DESC '%s \uC791\uC5C5 \uC131\uACF5\uD588\uC5B4\
        \uC694. \U0001F600 ' \"$STAGE\"\nprintf -v FOOTER '\u24D2 2023. \uAE30\uAE54\
        \uB098\uB294 \uC0AC\uB78C\uB4E4(giggals.pepole@gmail.com) All Rights Reserved.\
        \ Blog : https://giggal-people.tistory.com/\\n'\npayload=$(jq -n --arg title\
        \ \"$STAGE\" --arg desc \"$DESC\" --arg footer \"$FOOTER\" --arg url \"$BUILD_URL\"\
        \ '{embeds:[{title:$title, description:$desc, footer:{text:$footer}, url:$url}]}')\n\
        curl -sS -H \"Content-Type: application/json\" -d \"$payload\" \"$DISCORD_WEBHOOK_URL\"\
        \n"
    - name: SonarQube Quality Gate failure alarm
      if: ${{ failure() && steps.quality_gate.outcome == 'failure' && env.DISCORD_WEBHOOK_URL
        != '' }}
      env:
        STAGE: "\uC18C\uB098\uD050\uBE0C Quality Gate \uD655\uC778"
      run: "set -euo pipefail\nprintf -v DESC '%s \uC791\uC5C5 \uC2E4\uD328 \uD588\
        \uC5B4\uC694 \U0001F624' \"$STAGE\"\nprintf -v FOOTER '\u24D2 2023. \uAE30\
        \uAE54\uB098\uB294 \uC0AC\uB78C\uB4E4(giggals.pepole@gmail.com) All Rights\
        \ Reserved. Blog : https://giggal-people.tistory.com/\\n'\npayload=$(jq -n\
        \ --arg title \"$STAGE\" --arg desc \"$DESC\" --arg footer \"$FOOTER\" --arg\
        \ url \"$BUILD_URL\" '{embeds:[{title:$title, description:$desc, footer:{text:$footer},\
        \ url:$url}]}')\ncurl -sS -H \"Content-Type: application/json\" -d \"$payload\"\
        \ \"$DISCORD_WEBHOOK_URL\"\n"
    - name: "\uAC1C\uBC1C \uD658\uACBD Application \uC11C\uBC84\uC5D0 File \uC804\uB2EC\
        \ \uBC0F \uC2A4\uD06C\uB9BD\uD2B8 \uC2E4\uD589 \uAD8C\uD55C \uBD80\uC5EC"
      id: application_file
      if: ${{ success() && github.ref == 'refs/heads/develop' }}
      run: j2g_op application_file
    - name: "\uAC1C\uBC1C \uD658\uACBD Application \uC11C\uBC84\uC5D0 File \uC804\uB2EC\
        \ \uBC0F \uC2A4\uD06C\uB9BD\uD2B8 \uC2E4\uD589 \uAD8C\uD55C \uBD80\uC5EC post\
        \ success"
      if: ${{ success() && steps.application_file.outcome == 'success' }}
      run: j2g_op application_file_post_success
    - name: "\uAC1C\uBC1C \uD658\uACBD Application \uC11C\uBC84\uC5D0 File \uC804\uB2EC\
        \ \uBC0F \uC2A4\uD06C\uB9BD\uD2B8 \uC2E4\uD589 \uAD8C\uD55C \uBD80\uC5EC post\
        \ failure"
      if: ${{ failure() && steps.application_file.outcome == 'failure' }}
      run: j2g_op application_file_post_failure
    - name: "\uAC1C\uBC1C \uD658\uACBD Docker Image \uC0DD\uC131 \uBC0F Backup \uC791\
        \uC5C5"
      id: docker_image_backup
      if: ${{ success() && github.ref == 'refs/heads/develop' }}
      run: j2g_op docker_image_backup
    - name: "\uAC1C\uBC1C \uD658\uACBD Docker Image \uC0DD\uC131 \uBC0F Backup \uC791\
        \uC5C5 post success"
      if: ${{ success() && steps.docker_image_backup.outcome == 'success' }}
      run: j2g_op docker_image_backup_post_success
    - name: "\uAC1C\uBC1C \uD658\uACBD Docker Image \uC0DD\uC131 \uBC0F Backup \uC791\
        \uC5C5 post failure"
      if: ${{ failure() && steps.docker_image_backup.outcome == 'failure' }}
      run: j2g_op docker_image_backup_post_failure
    - name: "\uAC1C\uBC1C \uD658\uACBD Docker \uAD00\uB828 \uC791\uC5C5"
      id: docker
      if: ${{ success() && github.ref == 'refs/heads/develop' }}
      run: j2g_op docker
    - name: "\uAC1C\uBC1C \uD658\uACBD Docker \uAD00\uB828 \uC791\uC5C5 post success"
      if: ${{ success() && steps.docker.outcome == 'success' }}
      run: j2g_op docker_post_success
    - name: "\uAC1C\uBC1C \uD658\uACBD Docker \uAD00\uB828 \uC791\uC5C5 post failure"
      if: ${{ failure() && steps.docker.outcome == 'failure' }}
      run: j2g_op docker_post_failure
    - name: "\uC6B4\uC601 \uD658\uACBD WAS \uC11C\uBC84\uC5D0 File \uC804\uB2EC \uBC0F\
        \ \uC2A4\uD06C\uB9BD\uD2B8 \uC2E4\uD589 \uAD8C\uD55C \uBD80\uC5EC"
      id: was_file
      if: ${{ success() && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
        }}
      run: j2g_op was_file
    - name: "\uC6B4\uC601 \uD658\uACBD WAS \uC11C\uBC84\uC5D0 File \uC804\uB2EC \uBC0F\
        \ \uC2A4\uD06C\uB9BD\uD2B8 \uC2E4\uD589 \uAD8C\uD55C \uBD80\uC5EC post success"
      if: ${{ success() && steps.was_file.outcome == 'success' }}
      run: j2g_op was_file_post_success
    - name: "\uC6B4\uC601 \uD658\uACBD WAS \uC11C\uBC84\uC5D0 File \uC804\uB2EC \uBC0F\
        \ \uC2A4\uD06C\uB9BD\uD2B8 \uC2E4\uD589 \uAD8C\uD55C \uBD80\uC5EC post failure"
      if: ${{ failure() && steps.was_file.outcome == 'failure' }}
      run: j2g_op was_file_post_failure
    - name: "\uC6B4\uC601 \uD658\uACBD Docker Image \uC0DD\uC131 \uBC0F Backup \uC791\
        \uC5C5"
      id: docker_image_backup_2
      if: ${{ success() && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
        }}
      run: j2g_op docker_image_backup_2
    - name: "\uC6B4\uC601 \uD658\uACBD Docker Image \uC0DD\uC131 \uBC0F Backup \uC791\
        \uC5C5 post success"
      if: ${{ success() && steps.docker_image_backup_2.outcome == 'success' }}
      run: j2g_op docker_image_backup_post_success_2
    - name: "\uC6B4\uC601 \uD658\uACBD Docker Image \uC0DD\uC131 \uBC0F Backup \uC791\
        \uC5C5 post failure"
      if: ${{ failure() && steps.docker_image_backup_2.outcome == 'failure' }}
      run: j2g_op docker_image_backup_post_failure_2
    - name: "\uC6B4\uC601 \uD658\uACBD Application Docker \uAD00\uB828 \uC791\uC5C5"
      id: application_docker
      if: ${{ success() && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
        }}
      run: j2g_op application_docker
    - name: "\uC6B4\uC601 \uD658\uACBD Application Docker \uAD00\uB828 \uC791\uC5C5\
        \ post success"
      if: ${{ success() && steps.application_docker.outcome == 'success' }}
      run: j2g_op application_docker_post_success
    - name: "\uC6B4\uC601 \uD658\uACBD Application Docker \uAD00\uB828 \uC791\uC5C5\
        \ post failure"
      if: ${{ failure() && steps.application_docker.outcome == 'failure' }}
      run: j2g_op application_docker_post_failure
    - name: "\uC6B4\uC601 \uD658\uACBD DMZ \uC11C\uBC84 NGINX \uAD00\uB828 File \uC804\
        \uB2EC \uBC0F \uC2A4\uD06C\uB9BD\uD2B8 \uC2E4\uD589 \uAD8C\uD55C \uBD80\uC5EC"
      id: dmz_nginx_file
      if: ${{ success() && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
        }}
      run: j2g_op dmz_nginx_file
    - name: "\uC6B4\uC601 \uD658\uACBD DMZ \uC11C\uBC84 NGINX \uAD00\uB828 File \uC804\
        \uB2EC \uBC0F \uC2A4\uD06C\uB9BD\uD2B8 \uC2E4\uD589 \uAD8C\uD55C \uBD80\uC5EC\
        \ post success"
      if: ${{ success() && steps.dmz_nginx_file.outcome == 'success' }}
      run: j2g_op dmz_nginx_file_post_success
    - name: "\uC6B4\uC601 \uD658\uACBD DMZ \uC11C\uBC84 NGINX \uAD00\uB828 File \uC804\
        \uB2EC \uBC0F \uC2A4\uD06C\uB9BD\uD2B8 \uC2E4\uD589 \uAD8C\uD55C \uBD80\uC5EC\
        \ post failure"
      if: ${{ failure() && steps.dmz_nginx_file.outcome == 'failure' }}
      run: j2g_op dmz_nginx_file_post_failure
    - name: "\uC6B4\uC601 \uD658\uACBD DMZ \uC11C\uBC84 NGINX Docker \uAD00\uB828\
        \ \uC791\uC5C5"
      id: dmz_nginx_docker
      if: ${{ success() && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
        }}
      run: j2g_op dmz_nginx_docker
    - name: "\uC6B4\uC601 \uD658\uACBD DMZ \uC11C\uBC84 NGINX Docker \uAD00\uB828\
        \ \uC791\uC5C5 post success"
      if: ${{ success() && steps.dmz_nginx_docker.outcome == 'success' }}
      run: j2g_op dmz_nginx_docker_post_success
    - name: "\uC6B4\uC601 \uD658\uACBD DMZ \uC11C\uBC84 NGINX Docker \uAD00\uB828\
        \ \uC791\uC5C5 post failure"
      if: ${{ failure() && steps.dmz_nginx_docker.outcome == 'failure' }}
      run: j2g_op dmz_nginx_docker_post_failure
    - name: "Jenkins CI/CD \uC791\uC5C5 \uC644\uB8CC"
      id: jenkins_ci_cd
      if: ${{ success() }}
      run: j2g_op jenkins_ci_cd
    - name: "Jenkins CI/CD \uC791\uC5C5 \uC644\uB8CC post success"
      if: ${{ success() && steps.jenkins_ci_cd.outcome == 'success' }}
      run: j2g_op jenkins_ci_cd_post_success
    - name: "Jenkins CI/CD \uC791\uC5C5 \uC644\uB8CC post failure"
      if: ${{ failure() && steps.jenkins_ci_cd.outcome == 'failure' }}
      run: j2g_op jenkins_ci_cd_post_failure
'on':
  workflow_dispatch: null

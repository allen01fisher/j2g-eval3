name: Jenkins Pipeline Migration
concurrency:
  group: j2g-42ity__libpam0g-dev-pkgconfig__3f74db31-eval3-r0-build_feedback-i1-build0-${{
    github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DEPLOY_BRANCH_PATTERN: ${{ inputs.DEPLOY_BRANCH_PATTERN }}
      DEPLOY_JOB_NAME: ${{ inputs.DEPLOY_JOB_NAME }}
      DEPLOY_REPORT_RESULT: ${{ inputs.DEPLOY_REPORT_RESULT }}
      REQUIRE_GOOD_GITIGNORE: ${{ inputs.REQUIRE_GOOD_GITIGNORE }}
      DO_CLEANUP_AFTER_BUILD: ${{ inputs.DO_CLEANUP_AFTER_BUILD }}
    steps:
    - name: j2g-probe-install
      env:
        J2G_OP_B64: 
      run: mkdir -p /tmp/j2g && printf "%s" "$J2G_OP_B64" | base64 -d > /tmp/j2g/j2g_op
        && chmod +x /tmp/j2g/j2g_op && echo /tmp/j2g >> "$GITHUB_PATH"
    - name: pre-clean
      run: j2g_op pre_clean
    - name: git
      run: j2g_op git
    - name: Push to OBS
      if: ${{ success() && github.ref_type == 'branch' && (github.ref_name == 'master'
        || startsWith(github.ref_name, 'release/') || startsWith(github.ref_name,
        'featureimage/') || github.ref_name == 'FTY' || endsWith(github.ref_name,
        '-FTY-master') || endsWith(github.ref_name, '-FTY')) }}
      run: j2g_op push_to_obs
    - name: cleanup
      if: ${{ success() && inputs.DO_CLEANUP_AFTER_BUILD }}
      run: j2g_op cleanup
    - name: post_failure
      if: ${{ failure() }}
      run: j2g_op post_failure
    - name: post_success
      if: ${{ success() }}
      run: j2g_op post_success
env:
  J2G_RUN_ID: 42ity__libpam0g-dev-pkgconfig__3f74db31-eval3-r0-build_feedback-i1-build0
  J2G_FAULTS: ''
'on':
  workflow_dispatch:
    inputs:
      DEPLOY_BRANCH_PATTERN:
        description: Regular expression of branch names for which a deploy action
          would be attempted after a successful build and test; leave empty to not
          deploy. Reasonable value is ^(master|release/.*|feature/*)$
        required: false
        default: ${DEFAULT_DEPLOY_BRANCH_PATTERN}
        type: string
      DEPLOY_JOB_NAME:
        description: 'Name of your job that handles deployments and should accept
          arguments: DEPLOY_GIT_URL DEPLOY_GIT_BRANCH DEPLOY_GIT_COMMIT -- and it
          is up to that job what to do with this knowledge (e.g. git archive + push
          to packaging); leave empty to not deploy'
        required: false
        default: ${DEFAULT_DEPLOY_JOB_NAME}
        type: string
      DEPLOY_REPORT_RESULT:
        description: If the deployment is done, should THIS job wait for it to complete
          and include its success or failure as the build result (true), or should
          it schedule the job and exit quickly to free up the executor (false)
        required: false
        default: true
        type: boolean
      REQUIRE_GOOD_GITIGNORE:
        description: Require that there are no files not discovered changed/untracked
          via .gitignore after builds and tests?
        required: false
        default: true
        type: boolean
      DO_CLEANUP_AFTER_BUILD:
        description: When using temporary subdirs in build/test workspaces, wipe them
          after successful builds?
        required: false
        default: true
        type: boolean
